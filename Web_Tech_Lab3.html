<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width-device-width, initial-scale = 1.0" />
    <title>Donation Form</title>

    <!--Link to external CSS file-->
    <link rel="stylesheet" href="CSS_Lab3.css"
  </head>

  <body>
    <form action="/register" method="POST">
      <p1>* - Denotes required information<br /><br /></p1>

      <nav>
        <a href="/donation/">> 1 Donation</a> >
        <a href="/confirmation/">2 Confirmation</a> >
        <a href="/thankyou/">Thank You!</a>
      </nav>

      <h2>Donor Information</h2>

      <label for="firstname">First Name* </label>
      <input type="text" id="firstname" name="firstname" required />

      <label for="lastname">Last Name* </label>
      <input type="text" id="lastname" name="lastname" required />

      <label for="company">Company </label>
      <input type="text" id="company" name="company" />

      <label for="address1">Address 1* </label>
      <input type="text" id="address1" name="address1" />

      <label for="address2">Address 2 </label>
      <input type="text" id="address2" name="address2" required />

      <label for="state">State* </label>
      <select id="state" name="state" required>
        <option value="California">California</option>
        <option value="texas">Texas</option>
        <option value="Florida">Florida</option>
        <option value="newyork">New York</option>
        <option value="dhaka">Dhaka</option>
        <option value="rangpur">Rangpur</option>
        <option value="khulna">Khulna</option>
        <option value="sylhet">Sylhet</option>
        <option value="rajshahi">Rajshahi</option>
        <option value="gujrat">Gujrat</option>
        <option value="haryana">Haryana</option>
        <option value="kerala">Kerala</option>
      </select>

      <label for="zipcode">Zip Code* </label>
      <input type="text" id="zipcode" name="zipcode" required />

      <label for="country">Country: </label>
      <select id="country" name="country" required>
        <option value="Bangladesh">Bangladesh</option>
        <option value="USA">USA</option>
        <option value="India">India</option>
      </select>

      <label for="phone">Phone </label>
      <input type="text" id="phone" name="phone" />

      <label for="fax">Fax </label>
      <input type="text" id="fax" name="fax" required />

      <label for="email">Email* </label>
      <input type="email" id="email" name="email" required />

      <div class="donation-group">
        <label class="mainLabel" for="Donation Amount: "
          >Donation Amount* <br />(check a button or type in your amount)</label
        >
        <div>
          <input type="radio" id="none" name="amount" value="None" required />
          <label for="none">None</label>
          <input type="radio" id="$50" name="amount" value="$50" required />
          <label for="$50">$50</label>
          <input type="radio" id="$75" name="amount" value="$75" required />
          <label for="$75">$75</label>
          <input type="radio" id="$100" name="amount" value="$100" required />
          <label for="$100">$100</label>
          <input type="radio" id="$250" name="amount" value="$250" required />
          <label for="$250">$250</label>
          <input type="radio" id="other" name="amount" value="Other" required />
          <label for="other">Other</label>
        </div>
      </div>

      <label for="otheramount">Other Amount $ </label>
      <input type="number" id="otheramount" name="otheramount" min="1" />

      <!--<label for="dob">Date of Birht: </label>
      <input type="date" id="dob" name="dob" required />-->

      <label class="recurringDonation">
        <label class="mainRlabel" for="Recurring Donation "
          >Recurring Donation</label
        >
        <input
          type="checkbox"
          id="recurringDonation"
          name="recurringDonation"
        />
        I am interested in giving on a regular basis.
      </label>

      <div class="mCredit">
        <label for="monthlyCredit">Monthly Credit Card $ </label>
        <input type="number" id="monthlyCredit" name="monthlyCredit" />
        <label for="month">For </label>
        <input type="number" id="month" name="month" />
        <label>Months</label>
      </div>

      <h3>Honoriam and Memorial Donation Information</h3>

      <div class="honoriam">
        <label class="mainHlabel" for="honoriam: "
          >I would like to make this donation
        </label>
        <div>
          <input type="radio" id="honor" name="honor_mem" value="toHonor" />
          <label for="honor">To honor</label>
          <input type="radio" id="memory" name="honor_mem" value="inMemory" />
          <label for="memory">In memory of</label>
        </div>
      </div>

      <label for="name">Name </label>
      <input type="text" id="name" name="name" />

      <label for="acknowledge">Acknowledge donation to </label>
      <input type="text" id="name" name="name" />

      <label for="address">Address </label>
      <input type="text" id="address" name="address" />

      <label for="city">City </label>
      <input type="text" id="city" name="city" />

      <label for="state">State </label>
      <select id="state" name="state">
        <option value="California">California</option>
        <option value="texas">Texas</option>
        <option value="Florida">Florida</option>
        <option value="newyork">New York</option>
        <option value="dhaka">Dhaka</option>
        <option value="rangpur">Rangpur</option>
        <option value="khulna">Khulna</option>
        <option value="sylhet">Sylhet</option>
        <option value="rajshahi">Rajshahi</option>
        <option value="gujrat">Gujrat</option>
        <option value="haryana">Haryana</option>
        <option value="kerala">Kerala</option>
      </select>

      <label for="zip">Zip </label>
      <input type="text" id="zip" name="zip" />

      <h3>Additional Information</h3>

      <p>
        Please enter your name company or organization as you would like it to
        appear in our publications: <br />
      </p>
      <label for="org">Name </label>
      <input type="text" id="org" name="org" />

      <div class="preference">
        <label>
          <input type="checkbox" id="anonymous" name="anonymous" />
          I'd like my gift to remain anonymous.
        </label>

        <label>
          <input type="checkbox" id="matching" name="matching" />
          My employer offers a matching gift program. I will mail the matching
          gift form.
        </label>

        <label>
          <input type="checkbox" id="noMail" name="noMail" />
          Please save the cost of acknowledging this gift by not mailing a thank
          you letter.
        </label>
      </div>

      <label for="comment"
        >Comments<br />(please type any question or feedback here)
      </label>
      <input type="text" id="comment" name="comment" />

      <div class="contact">
        <label>How may we contact you?</label>
        <div class="contact-options">
          <label
            ><input type="checkbox" id="temail" name="temail" /> E-mail</label
          >
          <label
            ><input type="checkbox" id="tpmail" name="tpmail" /> Postal
            mail</label
          >
          <label
            ><input type="checkbox" id="tphone" name="tphone" />
            Telephone</label
          >
          <label><input type="checkbox" id="tfax" name="tfax" /> Fax</label>
        </div>
      </div>

      <div class="newsletter">
        <label
          >I would like to receive newsletters and information about special
          events by:</label
        >
        <div class="newsletter-options">
          <label
            ><input type="checkbox" id="email" name="email" /> E-mail</label
          >
          <label
            ><input type="checkbox" id="postMail" name="postMail" /> Post
            Mail</label
          >
          <label
            ><input type="checkbox" id="terms" name="terms" /> I would like
            information about volunteering with the company</label
          >
        </div>
      </div>

      <div class="button-group">
        <button type="reset">Reset</button>
        <button type="continue">Continue</button>
      </div>
    </form>
  </body>
</html>
