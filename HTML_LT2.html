<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Admission Form</title>
  </head>

  <body>
    <h1>University Admission Form</h1>

    <form action="/register" method="POST">
      <!-- PERSONAL INFORMATION -->
      <fieldset>
        <legend>Personal Information</legend>

        <label>Full Name:</label><br />
        <input
          type="text"
          name="fullname"
          maxlength="50"
          required
        /><br /><br />

        <label>Email Address:</label><br />
        <input type="email" name="email" required /><br /><br />

        <label>Date of Birth:</label><br />
        <input type="date" name="dob" required /><br /><br />

        <label>Gender:</label><br />
        <input type="radio" name="gender" value="Male" required /> Male
        <input type="radio" name="gender" value="Female" /> Female
        <input type="radio" name="gender" value="Other" /> Other <br /><br />
      </fieldset>

      <!-- ACADEMIC INFORMATION -->
      <fieldset>
        <legend>Academic Information</legend>

        <label>Previous Institution:</label><br />
        <input
          type="text"
          name="institution"
          maxlength="100"
          required
        /><br /><br />

        <label>Highest Qualification:</label><br />
        <select name="qualification" required>
          <option value="">-- Select Qualification --</option>
          <option value="High School">High School</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Bachelor">Bachelor</option>
          <option value="Master">Master</option>
        </select>
        <br /><br />

        <label>Interests (Choose all that apply):</label><br />
        <input type="checkbox" name="interest" value="Sports" /> Sports<br />
        <input type="checkbox" name="interest" value="Technology" />
        Technology<br />
        <input type="checkbox" name="interest" value="Arts" /> Arts<br />
        <input type="checkbox" name="interest" value="Science" />
        Science<br /><br />
      </fieldset>

      <!-- PREFERRED DEPARTMENT -->
      <fieldset>
        <legend>Preferred Department</legend>

        <label>Select Department:</label><br />
        <select name="department" required>
          <option value="">-- Choose Department --</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Business Administration">
            Business Administration
          </option>
          <option value="Electrical Engineering">Electrical Engineering</option>
          <option value="Psychology">Psychology</option>
        </select>
        <br /><br />
      </fieldset>

      <!-- DOCUMENT UPLOAD -->
      <fieldset>
        <legend>Required Documents</legend>

        <label>Upload Transcript:</label><br />
        <input type="file" name="transcript" required /><br /><br />

        <label>Upload Resume:</label><br />
        <input type="file" name="resume" /><br /><br />
      </fieldset>

      <!-- FORM BUTTONS -->
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>
  </body>
</html>
